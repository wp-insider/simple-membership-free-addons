          in: query
          description: Limit the results to transactions belonging to this subscription id.
          schema:
            type: string
        - name: after
          in: query
          description: Limit the results to transactions on or after this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: before
          in: query
          description: Limit the results to transactions on or before this date (YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response.
          headers:
            X-WP-Total:
              $ref: "#/components/headers/Total"
            X-WP-TotalPages:
              $ref: "#/components/headers/TotalPages"
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '429':
          $ref: "#/components/responses/RateLimited"
  /swpm/v1/transactions/{id}:
    get:
      tags:
        - Transactions
      operationId: getTransaction
      summary: Get a transaction
      parameters:
        - name: id
          in: path
          description: Post id of the transaction record.
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - links
                properties:
                  data:
                    $ref: "#/components/schemas/Transaction"
                  links:
                    $ref: "#/components/schemas/ResourceLinks"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '429':
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    swpmApiKey:
      type: apiKey
      in: header
      name: X-SWPM-API-Key
      description: API key copied from the add-on settings.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: SWPM API key
      description: The API key as a Bearer token.
    wordpressApplicationPassword:
      type: http
      scheme: basic
      description: WordPress username and Application Password for a user with membership management permission.
  headers:
    Total:
      description: "Total matching records, ignoring pagination."
      schema:
        type: integer
    TotalPages:
      description: Number of pages for the requested per_page.
      schema:
        type: integer
    RateLimitLimit:
      description: Requests allowed per minute.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current minute.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp when the current minute ends.
      schema:
        type: integer
  responses:
    BadRequest:
      description: Invalid request data or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Unauthorized:
      description: "Credentials are missing or invalid, or the WordPress user lacks membership management permission."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Forbidden:
      description: "The API or write access is disabled, or a filter rejected the request."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    NotFound:
      description: The requested record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    Conflict:
      description: The level still has assigned members and force was not set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
    ServerError:
      description: A database or linked WordPress user operation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestError"
  schemas:
    Member:
      type: object
      properties:
        member_id:
          type: integer
        user_name:
          type: string
        first_name:
          type:
            - string
            - "null"
        last_name:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        membership_level:
          type: integer
        membership_level_name:
          type: string
        initial_membership_level:
          type:
            - integer
            - "null"
        account_state:
          type:
            - string
            - "null"
        member_since:
          type: string
        subscription_starts:
          type:
            - string
            - "null"
        expiry_date:
          type:
            - string
            - "null"
        is_expired:
          type:
            - boolean
            - "null"
        last_accessed:
          type: string
        last_accessed_from_ip:
          type: string
        company_name:
          type:
            - string
            - "null"
        address_street:
          type:
            - string
            - "null"
        address_city:
          type:
            - string
            - "null"
        address_state:
          type:
            - string
            - "null"
        address_zipcode:
          type:
            - string
            - "null"
        country:
          type:
            - string
            - "null"
        home_page:
          type:
            - string
            - "null"
        gender:
          type:
            - string
            - "null"
        referrer:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        profile_image:
          type:
            - string
            - "null"
        txn_id:
          type:
            - string
            - "null"
        subscr_id:
          type:
            - string
            - "null"
        wp_user_id:
          type:
            - integer
            - "null"
    MemberCreate:
      type: object
      required:
        - email
        - password
        - membership_level
        - user_name
      properties:
        email:
          type: string
          format: email
          description: Email address of the member.
        password:
          type: string
          description: "Plain text password for the member. It is hashed before it is stored. When the plugin's Force Strong Password setting is on, it must meet that rule."
          writeOnly: true
        membership_level:
          type: integer
          description: Id of the membership level to assign to the member.
        first_name:
          type: string
          description: First name of the member.
        last_name:
          type: string
          description: Last name of the member.
        account_state:
          type: string
          enum:
            - active
            - inactive
            - activation_required
            - expired
            - pending
            - unsubscribed
          description: Account status of the member.
        gender:
          type: string
          enum:
            - male
            - female
            - not specified
          description: Gender recorded on the member profile.
        member_since:
          type: string
          format: date
          description: "Date the member joined, in YYYY-MM-DD format."
        subscription_starts:
          type: string
          format: date
          description: "Date the access period starts, in YYYY-MM-DD format. Membership expiry is calculated from this date."
        home_page:
          type: string
          format: uri
          description: Home page URL recorded on the member profile.
        notes:
          type: string
          description: Admin notes about the member.
        phone:
          type: string
          description: Phone number of the member.
        address_street:
          type: string
          description: Street address of the member.
        address_city:
          type: string
          description: City of the member.
        address_state:
          type: string
          description: State or region of the member.
        address_zipcode:
          type: string
          description: Postcode of the member.
        country:
          type: string
          description: "Country of the member, as a name from the plugin's country list or a two letter country code. Stored as the name."
        company_name:
          type: string
          description: Company name of the member.
        referrer:
          type: string
          description: Referrer recorded on the member profile.
        subscr_id:
          type: string
          description: Subscription id from the payment gateway.
        txn_id:
          type: string
          description: Transaction id from the payment gateway.
        user_name:
          type: string
          description: Username for the member. It cannot be changed after the profile is created.
        send_notification:
          type: boolean
          description: "Whether to email the member the registration notification. By default a member who must activate their account is emailed; otherwise the plugin's \"notification after manual user add\" setting decides."
    MemberUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Email address of the member.
        password:
          type: string
          description: "Plain text password for the member. It is hashed before it is stored. When the plugin's Force Strong Password setting is on, it must meet that rule."
          writeOnly: true
        membership_level:
          type: integer
          description: Id of the membership level to assign to the member.
        first_name:
          type: string
          description: First name of the member.
        last_name:
          type: string
          description: Last name of the member.
        account_state:
          type: string
          enum:
            - active
            - inactive
            - activation_required
            - expired
            - pending
            - unsubscribed
          description: Account status of the member.
        gender:
          type: string
          enum:
            - male
            - female
            - not specified
          description: Gender recorded on the member profile.
        member_since:
          type: string
          format: date
          description: "Date the member joined, in YYYY-MM-DD format."
        subscription_starts:
          type: string
          format: date
          description: "Date the access period starts, in YYYY-MM-DD format. Membership expiry is calculated from this date."
        home_page:
          type: string
          format: uri
          description: Home page URL recorded on the member profile.
        notes:
          type: string
          description: Admin notes about the member.
        phone:
          type: string
          description: Phone number of the member.
        address_street:
          type: string
          description: Street address of the member.
        address_city:
          type: string
          description: City of the member.
        address_state:
          type: string
          description: State or region of the member.
        address_zipcode:
          type: string
          description: Postcode of the member.
        country:
          type: string
          description: "Country of the member, as a name from the plugin's country list or a two letter country code. Stored as the name."
        company_name:
          type: string
          description: Company name of the member.
        referrer:
          type: string
          description: Referrer recorded on the member profile.
        subscr_id:
          type: string
          description: Subscription id from the payment gateway.
        txn_id:
          type: string
          description: Transaction id from the payment gateway.
    MembershipLevel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        subscription_period:
          type: string
        subscription_duration_type:
          type: integer
        subscription_duration_type_name:
          type: string
        annual_fixed_date_min_period:
          type:
            - integer
            - "null"
        default_account_status:
          type:
            - string
            - "null"
        email_activation:
          type: boolean
        after_activation_redirect_page:
          type:
            - string
            - "null"
        subscription_unit:
          type:
            - string
            - "null"
        loginredirect_page:
          type:
            - string
            - "null"
        protect_older_posts:
          type: boolean
        campaign_name:
          type: string
        member_count:
          type: integer
    MembershipLevelCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Display name of the membership level.
        role:
          type: string
          description: WordPress role given to members of this level.
        subscription_duration_type:
          type: integer
          enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            - 6
          description: "How the access duration is expressed. 0 no expiry, 1 days, 2 weeks, 3 months, 4 years, 5 fixed date, 6 annual fixed date."
        subscription_period:
          type: string
          description: "Length of access. A positive number for the days/weeks/months/years types, or a YYYY-MM-DD date for the fixed date types. Ignored when there is no expiry. For the annual fixed date type only the month and day are meaningful; the year is normalised on save."
        annual_fixed_date_min_period:
          type: integer
          minimum: 0
          description: "Minimum number of days of access for the annual fixed date duration type. When a member joins fewer than this many days before the fixed date, their expiry moves to the following year."
        default_account_status:
          type: string
          enum:
            - ""
            - active
            - inactive
            - activation_required
            - pending
            - expired
          description: Status given to new members of this level. An empty value uses the global setting.
        email_activation:
          type: boolean
          description: Whether new members of this level must confirm their email address before they can log in.
        after_activation_redirect_page:
          type: string
          format: uri
          description: URL members are sent to after activating their account by email. An empty value clears it.
        loginredirect_page:
          type: string
          format: uri
          description: URL members of this level are sent to after logging in.
        campaign_name:
          type: string
          description: Campaign name recorded against this level.
        protect_older_posts:
          type: boolean
          description: Whether posts published before a member joined are protected from them.
    MembershipLevelUpdate:
      type: object
